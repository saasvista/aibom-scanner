name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      # Guard: the git tag and the packaged version must agree. Without this a
      # mistyped tag publishes an unexpected version, and a PyPI release cannot
      # be replaced afterwards — only yanked.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib;print(re.search(r'^version\s*=\s*\"([^\"]+)\"',pathlib.Path('pyproject.toml').read_text(),re.M).group(1))")
          INIT=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',pathlib.Path('src/aibom_scanner/__init__.py').read_text()).group(1))")
          echo "tag=$TAG pyproject=$PKG __init__=$INIT"
          test "$TAG" = "$PKG"  || { echo "::error::tag $TAG != pyproject $PKG"; exit 1; }
          test "$TAG" = "$INIT" || { echo "::error::tag $TAG != __init__ $INIT"; exit 1; }
          ACT=$(python -c "import re,pathlib;print(re.search(r'aibom-scanner==([0-9][^\"\' ]*)',pathlib.Path('action.yml').read_text()).group(1))")
          echo "action.yml pin=$ACT"
          test "$TAG" = "$ACT"  || { echo "::error::tag $TAG != action.yml pin $ACT"; exit 1; }

      - name: Run tests before publishing
        run: |
          pip install -e ".[dev]"
          PYTHONPATH=src pytest tests/ -q

      - run: pip install build twine
      - run: python -m build

      # Validate package metadata renders on PyPI before uploading.
      - run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
