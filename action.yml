name: 'AIBOM Scanner'
description: 'Scan your codebase for AI SDK usage and compliance risks (NIST AI RMF, ISO 42001, EU AI Act, OWASP LLM and Agentic Top 10)'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  format:
    description: 'Output format (json, table, sarif)'
    required: false
    default: 'sarif'
  severity-threshold:
    description: 'Fail if OBSERVED findings at or above this severity (low, medium, high, critical). Findings with no supporting evidence in the scanned source do not trip this gate.'
    required: false
    default: 'high'
  fail-on-incomplete-coverage:
    description: 'Fail (exit 3) if the scan could not fully read or analyse some inputs (unsupported languages, unread files, oversized configs, symlinks, parse failures). Off by default.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Install aibom-scanner
      run: pip install "aibom-scanner==1.3.5"
      shell: bash
    - name: Run scan
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        INPUT_FAIL_ON_INCOMPLETE_COVERAGE: ${{ inputs.fail-on-incomplete-coverage }}
      run: |
        args=(--path "$INPUT_PATH" --format "$INPUT_FORMAT" --severity-threshold "$INPUT_SEVERITY_THRESHOLD")
        if [ "$INPUT_FAIL_ON_INCOMPLETE_COVERAGE" = "true" ]; then
          args+=(--fail-on-incomplete-coverage)
        fi
        aibom-scanner scan "${args[@]}"
      shell: bash
